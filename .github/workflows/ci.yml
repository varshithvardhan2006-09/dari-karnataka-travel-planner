name: Dari CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint check (ESLint)
        run: npm run lint

      - name: Run automated test suite (Vitest)
        run: npx vitest run

      - name: Production build (Next.js)
        run: npm run build
